<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #ffffff; stroke-width: 3; rx: 14; }
      .num { font-family: Arial, sans-serif; font-weight: bold; font-size: 26px; fill: #ffffff; }
      .title { font-family: Arial, sans-serif; font-weight: bold; font-size: 22px; }
      .desc { font-family: Arial, sans-serif; font-size: 14px; fill: #333333; }
      .arrow { stroke: #999999; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#999999"/>
    </marker>
  </defs>

  <rect width="1000" height="320" fill="#f7f8fa"/>
  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e">Debugging Assessment — The 4-Step Method</text>

  <!-- Step 1: Review -->
  <rect class="box" x="30" y="80" width="210" height="180" stroke="#2b6cb0" fill="#ebf4ff"/>
  <circle cx="65" cy="115" r="22" fill="#2b6cb0"/>
  <text x="65" y="123" text-anchor="middle" class="num">1</text>
  <text x="135" y="123" text-anchor="middle" class="title" fill="#2b6cb0">REVIEW</text>
  <text x="135" y="155" text-anchor="middle" class="desc">Read the problem</text>
  <text x="135" y="173" text-anchor="middle" class="desc">statement fully.</text>
  <text x="135" y="191" text-anchor="middle" class="desc">Read the ENTIRE code</text>
  <text x="135" y="209" text-anchor="middle" class="desc">before touching it.</text>
  <text x="135" y="235" text-anchor="middle" class="desc" font-style="italic">Don't fix line 1</text>
  <text x="135" y="250" text-anchor="middle" class="desc" font-style="italic">before understanding it.</text>

  <path class="arrow" d="M245,170 L275,170"/>

  <!-- Step 2: Identify -->
  <rect class="box" x="280" y="80" width="210" height="180" stroke="#2f855a" fill="#eafaf1"/>
  <circle cx="315" cy="115" r="22" fill="#2f855a"/>
  <text x="315" y="123" text-anchor="middle" class="num">2</text>
  <text x="385" y="123" text-anchor="middle" class="title" fill="#2f855a">IDENTIFY</text>
  <text x="385" y="155" text-anchor="middle" class="desc">Spot the errors:</text>
  <text x="385" y="173" text-anchor="middle" class="desc">logic, syntax,</text>
  <text x="385" y="191" text-anchor="middle" class="desc">or runtime bugs.</text>
  <text x="385" y="217" text-anchor="middle" class="desc" font-style="italic">There may be more</text>
  <text x="385" y="232" text-anchor="middle" class="desc" font-style="italic">than one issue —</text>
  <text x="385" y="247" text-anchor="middle" class="desc" font-style="italic">keep looking.</text>

  <path class="arrow" d="M495,170 L525,170"/>

  <!-- Step 3: Fix -->
  <rect class="box" x="530" y="80" width="210" height="180" stroke="#6b46c1" fill="#f3ecfc"/>
  <circle cx="565" cy="115" r="22" fill="#6b46c1"/>
  <text x="565" y="123" text-anchor="middle" class="num">3</text>
  <text x="635" y="123" text-anchor="middle" class="title" fill="#6b46c1">FIX</text>
  <text x="635" y="155" text-anchor="middle" class="desc">Make the MINIMAL</text>
  <text x="635" y="173" text-anchor="middle" class="desc">correct change so the</text>
  <text x="635" y="191" text-anchor="middle" class="desc">program runs as expected.</text>
  <text x="635" y="217" text-anchor="middle" class="desc" font-style="italic">Don't rewrite everything —</text>
  <text x="635" y="232" text-anchor="middle" class="desc" font-style="italic">targeted fixes avoid new</text>
  <text x="635" y="247" text-anchor="middle" class="desc" font-style="italic">bugs.</text>

  <path class="arrow" d="M745,170 L775,170"/>

  <!-- Step 4: Validate -->
  <rect class="box" x="780" y="80" width="190" height="180" stroke="#c53030" fill="#fdeeee"/>
  <circle cx="812" cy="115" r="22" fill="#c53030"/>
  <text x="812" y="123" text-anchor="middle" class="num">4</text>
  <text x="875" y="123" text-anchor="middle" class="title" fill="#c53030">VALIDATE</text>
  <text x="875" y="155" text-anchor="middle" class="desc">Check the logic,</text>
  <text x="875" y="173" text-anchor="middle" class="desc">test it, and handle</text>
  <text x="875" y="191" text-anchor="middle" class="desc">edge cases.</text>
  <text x="875" y="217" text-anchor="middle" class="desc" font-style="italic">Normal case + edge</text>
  <text x="875" y="232" text-anchor="middle" class="desc" font-style="italic">case (empty, single,</text>
  <text x="875" y="247" text-anchor="middle" class="desc" font-style="italic">boundary) — always.</text>

  <text x="500" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555555">1 question · ~20 minutes · Languages: C, C++, Java · Key concepts: Trees, Graphs, 2D DP, Advanced DSA</text>
</svg>
